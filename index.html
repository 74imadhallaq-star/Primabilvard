<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prima Bilvård</title>
</head>
<body>
  <p>Prima Bilvård laddas…</p>
  <script>
    (async function () {
      try {
        const response = await fetch('https://raw.githubusercontent.com/74imadhallaq-star/Primabilvard/eb1ca31fc1617c8d1177308f0e851f039120e1c2/index.html');
        if (!response.ok) throw new Error('Kunde inte ladda hemsidan.');
        let html = await response.text();
        html = html.replaceAll('Karlsgatan 21, 291 95 Kristianstad', 'Karlsgatan 21, 291 59 Kristianstad');
        html = html.replaceAll('https://www.instagram.com/priimabilvard/', 'https://www.instagram.com/prima_bilvard/');
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.body.textContent = 'Hemsidan kunde inte laddas. Försök igen senare.';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
